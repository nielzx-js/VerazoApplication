<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verazo</title>
    <link rel="stylesheet" href="../style/redefine.css">
</head>
<body>
    <div class="img">
        <img src="../images/logo verazo.jpeg" alt="">
    </div>

    <div class="title">
        <h1>Redefinição de senha</h1>
    </div>

    <!-- Formulário principal para solicitação/validação do código -->
    <form action="#" method="POST">

        <!-- Bloco de Campos de Entrada -->
        <div class="container">
            <h2>Preencha seus dados para fazer a redefinição</h2>

            <!-- Campo: Email Corporativo -->
            <label for="email">E-mail Corporativo</label>
            <input type="email" id="email" name="email" required>

            <!-- Campo: Código de Redefinição -->
            <label for="codigo">Código de Redefinição de Senha</label>
            <input type="text" id="codigo" name="codigo" placeholder="Digite o código enviado" required>
        </div>

        <!-- Bloco do Botão de Avançar -->
        <div class="button-next">
            <button type="submit">Próximo</button>
        </div>

    </form>

</body>
</html>
