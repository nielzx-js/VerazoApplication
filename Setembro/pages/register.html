<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verazo</title>
    <link rel="stylesheet" href="../style/register.css">
</head>
<body>

    <div class="img">
        <img src="../images/logo verazo.jpeg" alt="Logo Verazo">
     </div>

    <div class="title">
        <h1>Crie sua conta Verazo</h1>
    </div>

    <!--Formulário para preencher os dados para Criar conta-->
    
    <form action="#" method="POST">
        
        <div class="container">
            <h2>Preencha seus dados para começar</h2>

            <!--Campo para colocar o nome completo-->

            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" required autofocus>

            <!--Campo para colocar o email corporativo-->

            <label for="email">Email Corporativo</label>
            <input type="email" id="email" name="email" required autofocus>

            <!--Campo para criar a senha-->

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" minlength="6" required autofocus>

            <!--Campo para confirmar a senha-->

            <label for="confirmar-senha">Confirmar Senha</label>
            <input type="password" id="confirmar-senha" name="confirmar_senha" minlength="6" required autofocus>
        </div>

            <!--Botão para aceitar os termos de uso-->

        <div class="terms">
            <input type="checkbox" id="termos" name="termos" required>
            <label for="termos">Eu concordo com os <a href="#">Termos de Uso</a></label>
        </div>

            <!--Botão de criar conta-->

        <div class="button-create">
            <button type="submit">Criar Conta</button>
        </div>

    </form>

    <!--Link para usuario que ja tem uma conta criada e quer fazer login-->

    <div class="link-login">
        <p>Já tem conta? <a href="/login">Faça login</a></p>
    </div>

</body>
</html>
