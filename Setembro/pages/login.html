<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verazo</title>
    <link rel="stylesheet" href="../style/login.css">
</head>
<body>

    <div class="img">
        <img src="../images/logo verazo.jpeg" alt="Logo Verazo">
    </div>

    <div class="title">
        <h1>Bem-vindo(a) de volta!</h1>
    </div>

    <!--FORMULÁRIO PARA PREENCHER OS DADOS JÁ CADASTRADOS-->

    <form action="#" method="POST">

        <div class="container">
            <h2>Preencha seus dados para fazer login</h2>

            <!--CAMPO PARA COLOCAR O E-MAIL CORPORATIVO-->
            <label for="email">E-mail Corporativo</label>
            <input type="email" id="email" name="email" required autofocus>

            <!--CAMPO PARA COLOCAR A SENHA-->
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required autofocus>
        </div>


        <!--LINK PARA USUÁRIOS QUE ESQUECERAM A SENHA-->
        <div class="forgot-password">
            <p>Esqueceu a senha? <a href="/esqueci-senha">Redefinir</a></p>
        </div>

        <!--BOTÃO PARA ENTRAR NA PLATAFORMA VERAZO-->
        <div class="button-login">
            <button type="submit">Entrar no Verazo</button>
        </div>

    </form>


    <!--LINK PARA USUÁRIOS QUE AINDA NÃO TEM UMA CONTA-->
    <div class="link-register">
        <p>Ainda não possui conta? <a href="/cadastro">Cadastre-se</a></p>
    </div>

</body>
</html>
