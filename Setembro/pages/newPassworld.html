<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verazo</title>
</head>
<body>

    
    <div class="img">
        
    </div>

    
    <div class="title">
        <h1>Redefinição de senha</h1>
    </div>

    <!-- Formulário para a alteração da senha -->
    <form action="#" method="POST">

        <!-- Bloco de Campos para redefinir a Senha -->
        <div class="container">
            <h2>Preencha seus dados para fazer a redefinição</h2>

            <!-- Campo: Nova Senha -->
            <label for="nova-senha">Nova Senha</label>
            <input type="password" id="nova-senha" name="nova_senha" minlength="6" required>

            <!-- Campo: Confirmar Nova Senha -->
            <label for="confirmar-nova-senha">Confirmar Nova Senha</label>
            <input type="password" id="confirmar-nova-senha" name="confirmar_nova_senha" minlength="6" required>
        </div>

        <!-- Bloco do Botão de Salvar/Concluir -->
        <div class="button-save">
            <button type="submit">Próximo</button>
        </div>

    </form>

</body>
</html>
