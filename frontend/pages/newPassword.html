<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verazo</title>
    <link rel="stylesheet" href="../style/newPassworld.css">
</head>
<body>

    
    <div class="img">
        <img src="../images/logo verazo.jpeg" alt="Logo Verazo">
    </div>

    
    <div class="title">
        <h1>Redefinição de senha</h1>
    </div>

    <!-- Formulário para a alteração da senha -->
    <form action="#" method="POST">

        <!-- Bloco de Campos para redefinir a Senha -->
        <div class="container">
            <h2>Preencha seus dados para fazer a redefinição</h2>

            <!-- Campo: Nova Senha -->
            <label for="nova-senha">Nova Senha</label>
            <input type="password" id="nova-senha" name="nova_senha" minlength="6" required autofocus>

            <!-- Campo: Confirmar Nova Senha -->
            <label for="confirmar-nova-senha">Confirmar Nova Senha</label>
            <input type="password" id="confirmar-nova-senha" name="confirmar_nova_senha" minlength="6" required autofocus>
        </div>

        <!-- Bloco do Botão de Salvar/Concluir -->
        <div class="button-save">
            <button type="submit">Próximo</button>
        </div>

    </form>

    <script>
  const form = document.querySelector('form');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const inputs = document.querySelectorAll('input[type="password"]');
    const newPassword = inputs[0].value;
    const confirmPassword = inputs[1].value;

    if (newPassword !== confirmPassword) {
      alert('As senhas não coincidem!');
      return;
    }

    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ newPassword, confirmPassword })
      });

      const data = await res.json();

      if (res.ok) {
        alert(data.message || 'Senha atualizada com sucesso!');
        // Agora sim vai para o login
        window.location.href = data.redirectTo; 
      } else {
        alert(data.message || 'Erro ao redefinir a senha.');
      }
    } catch (err) {
      console.error(err);
      alert('Erro de conexão com o servidor.');
    }
  });
</script>

</body>
</html>
